[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "payment-processing-service"
version = "1.0.0"
description = "Compact asynchronous payment processing test task"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "fastapi==0.139.2",
    "faststream[rabbit]==0.7.2",
    "httpx==0.28.1",
    "pydantic-settings==2.10.1",
    "sqlalchemy[asyncio]==2.0.51",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.1.0",
    "pytest-cov==6.2.1",
    "ruff==0.12.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
packages = ["payment_service"]

[tool.coverage.run]
source = ["payment_service"]
branch = true
